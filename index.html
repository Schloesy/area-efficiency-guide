<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b35"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Area Efficiency Guide for INTVL</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#18342f;background:#f3f6f2}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:20px 15px 50px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}h1{font-size:32px;margin:0;letter-spacing:-1px}.tag{font-size:12px;background:#d9e9e0;padding:6px 10px;border-radius:30px}.card{background:white;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #163d2c0b}h2{font-size:19px;margin:0 0 12px}p{line-height:1.5;color:#5c7068}input[type=file]{width:100%;padding:16px;border:2px dashed #a2c0b2;border-radius:14px;background:#f7faf7}button{background:#176c51;color:white;border:0;padding:14px 18px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;margin:12px 8px 0 0}button:disabled{opacity:.4}button.secondary{background:#e3ede6;color:#215a47}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#f1f7f2;border-radius:14px;padding:14px}.stat span{font-size:12px;color:#5e776d}.stat strong{display:block;font-size:23px;margin-top:5px}.route{border-top:1px solid #e5ede7;padding:17px 0}.route:first-child{border-top:0}.route h3{font-size:15px;overflow-wrap:anywhere;margin:0 0 10px}.small{font-size:13px;color:#657b70}.error{color:#9c2d29}#results:empty:before{content:"Noch keine Auswertung.";color:#74847c}footer{font-size:12px;color:#68796f;margin-top:25px} .route-map{border:1px solid #dfebdf;border-radius:14px;overflow:hidden;margin:12px 0;background:#f3f8f3}.map-legend{padding:9px 12px;font-size:12px;color:#416452;background:white}
